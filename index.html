<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>몬스테라 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone column — room scene with the pot, growth line, four care gauges, action tray at thumb height */
:root {
  --bg: #E8EEE5;
  --surface: #F8FBF5;
  --paper: #FFFDF6;
  --ink: #17251D;
  --ink-soft: #506157;
  --line: #C9D5C6;
  --leaf: #2D6943;
  --leaf-deep: #1E4B30;
  --leaf-new: #A3CF5E;
  --sun: #C98A12;
  --sun-soft: #F6E7C3;
  --good: #2F8150;
  --warn: #B86A12;
  --bad: #B23E35;
  --good-soft: #DDEFE2;
  --warn-soft: #F7E6CF;
  --bad-soft: #F6DDDA;
  --room-wall: #DCE5D6;
  --room-floor: #CDBA9C;
  --font-display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Gaegu", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1511; --surface: #16211B; --paper: #1D2A22; --ink: #E3ECE4; --ink-soft: #9BAEA1; --line: #2B3B32;
    --leaf: #4C9666; --leaf-deep: #2D6A45; --leaf-new: #ABD86B; --sun: #E8B54A; --sun-soft: #3A3020;
    --good: #62BC83; --warn: #E5A04E; --bad: #EA7368; --good-soft: #1C3326; --warn-soft: #3A2C1A; --bad-soft: #3D2220;
    --room-wall: #1C2721; --room-floor: #2E271E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1511; --surface: #16211B; --paper: #1D2A22; --ink: #E3ECE4; --ink-soft: #9BAEA1; --line: #2B3B32;
  --leaf: #4C9666; --leaf-deep: #2D6A45; --leaf-new: #ABD86B; --sun: #E8B54A; --sun-soft: #3A3020;
  --good: #62BC83; --warn: #E5A04E; --bad: #EA7368; --good-soft: #1C3326; --warn-soft: #3A2C1A; --bad-soft: #3D2220;
  --room-wall: #1C2721; --room-floor: #2E271E;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box; min-height: 100%; max-width: 540px; margin: 0 auto;
  padding-inline: 16px; padding-block: 12px 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem;
  line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance;
}
.brand .sub { margin: 2px 0 0; font-size: 0.82rem; color: var(--ink-soft); }
.wallet { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 0.9rem; font-variant-numeric: tabular-nums;
}
.chip svg { width: 16px; height: 16px; flex-shrink: 0; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0;
}
.icon-btn svg, .act svg, .chip svg.stroke {
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.icon-btn svg { width: 20px; height: 20px; }

.scene {
  position: relative; flex: 1 1 auto; min-height: 290px; border-radius: 22px; overflow: hidden;
  background: var(--room-wall); border: 1px solid var(--line);
}
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
.scene-top {
  position: absolute; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.scene-top > * { pointer-events: auto; }
.spot-chip {
  font: inherit; font-size: 0.78rem; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); color: var(--ink);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
}
.save-chip {
  font-size: 0.72rem; padding: 5px 9px; border-radius: 999px; color: var(--ink-soft); white-space: nowrap;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
}
.note {
  margin: -4px 0 0; padding: 6px 12px 7px; border-radius: 4px 14px 14px 14px;
  background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--good);
  font-family: var(--font-hand); font-size: 1.15rem; line-height: 1.25; color: var(--ink);
}
.note[data-tone="warn"] { border-left-color: var(--warn); }
.note[data-tone="bad"] { border-left-color: var(--bad); }
.toast {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 28px); box-sizing: border-box;
  padding: 8px 14px; border-radius: 12px; text-align: center; font-size: 0.88rem;
  background: var(--ink); color: var(--bg); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}
.toast[data-tone="warn"] { background: var(--warn-soft); color: var(--ink); box-shadow: inset 4px 0 0 var(--warn), 0 6px 18px rgba(0,0,0,.14); }
.toast[data-tone="bad"] { background: var(--bad-soft); color: var(--ink); box-shadow: inset 4px 0 0 var(--bad), 0 6px 18px rgba(0,0,0,.14); }

.growth { display: grid; gap: 6px; }
.growth-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.growth-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.06rem; text-wrap: balance; }
.leafcount { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 0.88rem; white-space: nowrap; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--leaf), var(--leaf-new)); transition: width 0.6s; }
.bar[data-blocked="1"] i { background: var(--warn); }
.growth-sub { margin: 0; font-size: 0.82rem; color: var(--ink-soft); }

.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.gauge { display: grid; gap: 5px; min-width: 0; }
.g-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.g-label { font-size: 0.86rem; white-space: nowrap; }
.g-right { display: inline-flex; align-items: center; gap: 6px; }
.g-val { font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.g-state {
  font-size: 0.7rem; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  background: var(--good-soft); color: var(--good);
}
.gauge[data-l="warn"] .g-state { background: var(--warn-soft); color: var(--warn); }
.gauge[data-l="bad"] .g-state { background: var(--bad-soft); color: var(--bad); }
.gauge[data-l="ok"] .g-state { background: var(--line); color: var(--ink-soft); }
.g-bar { position: relative; height: 7px; border-radius: 999px; background: var(--line); }
.g-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: var(--good); transition: width 0.5s; }
.gauge[data-l="warn"] .g-bar i { background: var(--warn); }
.gauge[data-l="bad"] .g-bar i { background: var(--bad); }
.gauge[data-l="ok"] .g-bar i { background: var(--ink-soft); }
.g-band { position: absolute; top: -2px; bottom: -2px; border-left: 2px solid var(--ink-soft); border-right: 2px solid var(--ink-soft); opacity: 0.5; z-index: 1; }

.banners { display: grid; gap: 8px; }
.banners:empty { display: none; }
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.92rem; text-align: left; cursor: pointer;
}
.banner[data-tone="sun"] { background: var(--sun-soft); border-color: transparent; }
.banner[data-tone="bad"] { background: var(--bad-soft); border-color: transparent; }
.banner[data-tone="warn"] { background: var(--warn-soft); border-color: transparent; }
.banner[data-tone="good"] { background: var(--good-soft); border-color: transparent; }
.banner .go { font-weight: 700; white-space: nowrap; }

.tray { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (min-width: 560px) { .tray { grid-template-columns: repeat(6, 1fr); } }
.act {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 62px; padding: 8px 4px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.86rem; cursor: pointer;
  transition: transform 0.12s, background 0.2s, border-color 0.2s;
}
.act svg { width: 24px; height: 24px; }
.act:active { transform: scale(0.96); }
.act[data-hint="1"] { border-color: var(--warn); background: var(--warn-soft); }
.act .badge {
  position: absolute; top: 6px; right: 8px; min-width: 18px; padding: 0 5px; border-radius: 999px;
  font-size: 0.7rem; line-height: 1.5; background: var(--leaf); color: var(--surface); font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 14, 10, 0.45); }
.sheet {
  position: relative; box-sizing: border-box; width: 100%; max-width: 540px; max-height: 86%; overflow: auto;
  background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; text-wrap: balance; }
.sheet h4 { margin: 18px 0 8px; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.sheet p { margin: 0 0 10px; }
.lead { color: var(--ink-soft); }
.primary {
  width: 100%; margin-top: 8px; padding: 13px 16px; border-radius: 14px; border: 0;
  background: var(--leaf); color: var(--surface); font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
}
.secondary {
  width: 100%; margin-top: 8px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); font: inherit; font-size: 0.95rem; cursor: pointer;
}
.secondary.danger { color: var(--bad); border-color: var(--bad-soft); }
.secondary.danger[data-armed="1"] { background: var(--bad-soft); }
.rules { margin: 0 0 8px; padding: 0; list-style: none; display: grid; gap: 8px; }
.rules li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; font-size: 0.94rem; }
.rules b { font-family: var(--font-display); font-weight: 600; color: var(--leaf); }
.wallet-line { display: flex; justify-content: space-between; color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 4px; }
.shop-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.si-text { display: grid; gap: 2px; min-width: 0; }
.si-text span { font-size: 0.84rem; color: var(--ink-soft); }
.buy {
  flex-shrink: 0; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--leaf); background: transparent;
  color: var(--leaf); font: inherit; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.buy:disabled { opacity: 0.45; cursor: not-allowed; }
.owned { flex-shrink: 0; font-size: 0.86rem; color: var(--good); white-space: nowrap; }
.spots { display: grid; gap: 8px; }
.spot-opt {
  display: grid; gap: 3px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
}
.spot-opt[aria-pressed="true"] { border: 2px solid var(--leaf); background: var(--good-soft); }
.spot-opt b { font-family: var(--font-display); font-weight: 600; }
.spot-opt .lux { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.spot-opt .desc { font-size: 0.86rem; }
.list { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 0.92rem; }
.summary { display: grid; gap: 0; margin: 0 0 14px; padding: 0; list-style: none; }
.summary li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.summary li span { color: var(--ink-soft); }
.hand { font-family: var(--font-hand); font-size: 1.18rem; line-height: 1.3; }
.muted { color: var(--ink-soft); font-size: 0.9rem; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>몬스테라 키우기</h1>
      <p class="sub" id="sub">함께한 지 1일째 · 1세대</p>
    </div>
    <div class="wallet">
      <span class="chip" title="코인">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--sun)"/><path d="M8 4.2c-2 1.4-2.6 4.4-.2 7.4 2.4-3 1.8-6-.2-7.4zM8 5.5v6" fill="none" stroke="var(--surface)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="sr">코인</span> <b id="coins">0</b>
      </span>
      <span class="chip" title="영양제">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 1.5h3v2l1.5 2.2v7.3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 5 13V5.7l1.5-2.2z" fill="var(--leaf-new)" stroke="var(--leaf)" stroke-width="1"/></svg>
        <span class="sr">영양제</span> <b id="feedCount">0</b>
      </span>
      <button class="icon-btn" id="btnInfo" type="button" aria-label="몬스테라 노트와 기록">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7h6M9 10.5h4"/></svg>
      </button>
    </div>
  </header>

  <section class="scene" id="scene" aria-label="몬스테라가 있는 방">
    <canvas id="cv" role="img" aria-label="몬스테라 화분"></canvas>
    <div class="scene-top">
      <button class="spot-chip" id="spotChip" type="button">커튼 친 창가 · 약 2,000 lux</button>
      <span class="save-chip" id="saveChip">이 기기에 저장</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </section>

  <p class="note" id="note" data-tone="good">잘 자라고 있어요.</p>

  <section class="growth" aria-label="자람">
    <div class="growth-head">
      <h2 id="stageName">1단계 · 새싹</h2>
      <span class="leafcount" id="leafCount">잎 1 / 15</span>
    </div>
    <div class="bar" id="growBarWrap"><i id="growBar"></i></div>
    <p class="growth-sub" id="growSub">다음 잎까지 0%</p>
  </section>

  <section class="gauges" aria-label="돌봄 상태">
    <div class="gauge" id="g-m"><div class="g-head"><span class="g-label">흙 수분</span><span class="g-right"><span class="g-val"></span><span class="g-state"></span></span></div><div class="g-bar"><span class="g-band" style="left:30%;width:45%"></span><i></i></div></div>
    <div class="gauge" id="g-h"><div class="g-head"><span class="g-label">습도</span><span class="g-right"><span class="g-val"></span><span class="g-state"></span></span></div><div class="g-bar"><span class="g-band" style="left:60%;width:40%"></span><i></i></div></div>
    <div class="gauge" id="g-u"><div class="g-head"><span class="g-label">영양</span><span class="g-right"><span class="g-val"></span><span class="g-state"></span></span></div><div class="g-bar"><span class="g-band" style="left:30%;width:60%"></span><i></i></div></div>
    <div class="gauge" id="g-health"><div class="g-head"><span class="g-label">건강</span><span class="g-right"><span class="g-val"></span><span class="g-state"></span></span></div><div class="g-bar"><span class="g-band" style="left:65%;width:35%"></span><i></i></div></div>
  </section>

  <div class="banners" id="banners"></div>

  <nav class="tray" aria-label="돌보기">
    <button class="act" id="aWater" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h10v8.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 18.5z"/><path d="M14 12.5l5.5-4.5"/><path d="M18.5 6.5l2 2"/><path d="M6 10V8.5a3 3 0 0 1 6 0V10"/></svg>
      <span class="lbl">물주기</span>
    </button>
    <button class="act" id="aMist" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="8" height="11" rx="2"/><path d="M8 10V7h4v3"/><path d="M12 7h3.5l1 1.2"/><path d="M19 4.5h.01M21 7h.01M19 9.5h.01M21.2 2.5h.01"/></svg>
      <span>분무</span>
    </button>
    <button class="act" id="aFeed" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4v3l2 3v10.5a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 8 19.5V9l2-3z"/><path d="M8 13h8"/></svg>
      <span>영양제</span><span class="badge" id="feedBadge">0</span>
    </button>
    <button class="act" id="aClean" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5l1.6 4.2 4.2 1.6-4.2 1.6L11 15.1l-1.6-4.2-4.2-1.6 4.2-1.6z"/><path d="M18 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      <span>잎 닦기</span>
    </button>
    <button class="act" id="aSpot" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="1"/><path d="M12 3v15M4 10.5h16M3 21h18"/></svg>
      <span>자리</span>
    </button>
    <button class="act" id="aShop" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      <span>상점</span>
    </button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>

<script>
(() => {
  'use strict';

  /* ---------- 규칙 ---------- */
  const KEY = 'monstera-kiugi-v1';
  const MIN = 60e3, HOUR = 3600e3, DAY = 24 * HOUR;
  const MAX_LEAVES = 15, POLE_AT = 8, AWAY_MS = 20 * MIN;
  const SPOTS = {
    dim:    { name: '어두운 방 구석',   lux: '약 300 lux',    light: 0.35, dry: 1.0, fen: false, burn: false,

  // 잎 윤곽 (잎자루가 붙는 곳이 원점, 잎끝이 y=-1)
  const SEGS = [
    [[0, 0], [0.08, 0.10], [0.20, 0.16], [0.30, 0.12]],
    [[0.30, 0.12], [0.48, 0.05], [0.56, -0.20], [0.50, -0.42]],
    [[0.50, -0.42], [0.44, -0.68], [0.20, -0.90], [0, -1]],
  ];
  function bez(sg, t) {
    const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * sg[0][0] + b * sg[1][0] + c * sg[2][0] + d * sg[3][0], a * sg[0][1] + b * sg[1][1] + c * sg[2][1] + d * sg[3][1]];

    const right = [];
    for (const sg of SEGS) for (let k = 0; k <= 12; k++) right.push(bez(sg, k / 12));

  function rayDist(mx, my, dx, dy) {

  const SPLIT = { 1: { n: 3, depth: 0.45 }, 2: { n: 5, depth: 0.6 }, 3: { n: 7, depth: 0.72 } };

    const R = rng(L.seed * 7 + 13);

    const ox = w / 2, oy = pad + Ldev * 1.03;
    const X = (x) => ox + x * Ldev * Wf, Y = (y) => oy + y * Ldev;

    const path = new Path2D();
    path.moveTo(X(0), Y(0));
    for (const sg of SEGS) path.bezierCurveTo(X(sg[1][0]), Y(sg[1][1]), X(sg[2][0]), Y(sg[2][1]), X(sg[3][0]), Y(sg[3][1]));

      const sg = SEGS[i];
      path.bezierCurveTo(X(-sg[2][0]), Y(sg[2][1]), X(-sg[1][0]), Y(sg[1][1]), X(-sg[0][0]), Y(sg[0][1]));
    }
    path.closePath();

    const base = mix(T.leafNew, T.leaf, ease(age));
    const baseHex = mixHex(T.leafNew, T.leaf, ease(age));
    const grad = g.createLinearGradient(X(-0.5), Y(-1), X(0.5), Y(0.1));
    grad.addColorStop(0, mix(baseHex, T.leafNew, 0.22));
    grad.addColorStop(1, base);
    g.fillStyle = grad;
    g.fill(path);

    g.save();
    g.clip(path);

    const nV = cfg ? cfg.n : 4;
    g.strokeStyle = mix(baseHex, T.leafNew, 0.55);
    g.globalAlpha = 0.6;
    g.lineWidth = Math.max(1, Ldev * 0.016);
    g.beginPath(); g.moveTo(X(0), Y(0.04)); g.lineTo(X(0), Y(-0.96)); g.stroke();
    g.globalAlpha = 0.35;

    }

    const blot = (col, alpha, count, tipBias) => {
      for (let q = 0; q < count; q++) {

        const cx = X(px * 0.86), cy = Y(py * 0.92), rr = Ldev * (0.12 + R2() * 0.1);

    if (L.burn > 0.03) blot('118,72,34', Math.min(0.9, L.burn * 0.95), 3, true);

  function getLeaf(L, Lpx, p, now) {

    const key = `${Ldev}|${Math.round(p * 30)}|${Math.round(L.dmg * 8)}|${Math.round(L.burn * 8)}|${Math.round(state.dust / 12)}|${Math.round(age * 8)}|${L.mat}|${themeKey}`;

  function layout(s, now, t, S, cx, soilY, still) {
    const n = s.leaves.length, items = [];
    const stemH = s.pole ? Math.min(POLE_H * 0.82, 20 * n) : 0;
    const calm = still || reduceMQ.matches;
    for (let i = 0; i < n; i++) {
      const L = s.leaves[i], R = rng(L.seed);
      const j1 = R() - 0.5, j2 = R() - 0.5, j3 = R();
      const r = n > 1 ? (n - 1 - i) / (n - 1) : 0;
      const side = i % 2 === 0 ? -1 : 1;
      const p = clamp((now - L.born) / (3 * HOUR), 0, 1), pe = ease(p);
      let ax, ay, a;
      if (s.pole) {
        ax = cx + side * 4 * S; ay = soilY - stemH * S * ((i + 1) / n);
        a = side * (0.45 + 0.8 * r) + j1 * 0.25;
      } else {

  function targetZoom(s, now, cx, groundY, S0) {
    const pot = POT_GEOM[s.pot];

    const { items } = layout(s, now, 0, S0, cx, soilY0, true);
    let minY = soilY0 - pot.h * S0 * 0.2, maxDx = (pot.w * S0) / 2;
    for (const it of items) {

  }

  function drawRoom(now, t) {
    const s = state, sp = s.spot, night = isNight(now);
    const floorY = H * 0.76;
    ctx.fillStyle = T.wall; ctx.fillRect(0, 0, W, floorY);
    ctx.fillStyle = T.floor; ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(0, floorY - 5, W, 5);
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
    for (let k = 1; k < 5; k++) { const y = floorY + ((H - floorY) * k) / 5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    if (sp !== 'dim') {
      const wx = Math.max(14, W * 0.06), wy = H * 0.1, ww = Math.min(W * 0.36, 190), wh = Math.min(H * 0.5, 260);
      if (!night && sp === 'sunny') {
        ctx.fillStyle = 'rgba(255,212,110,0.26)';
        ctx.beginPath(); ctx.moveTo(wx + ww * 0.1, floorY); ctx.lineTo(wx + ww * 1.1, floorY); ctx.lineTo(wx + ww * 2.1, H); ctx.lineTo(wx + ww * 0.6, H); ctx.closePath(); ctx.fill();
      }
      const sky = ctx.createLinearGradient(0, wy, 0, wy + wh);
      if (night) { sky.addColorStop(0, '#0E1B30'); sky.addColorStop(1, '#22365A'); }
      else if (sp === 'sunny') { sky.addColorStop(0, '#9ED3F0'); sky.addColorStop(1, '#E6F4FB'); }
      else { sky.addColorStop(0, '#B9DCEB'); sky.addColorStop(1, '#EAF4F7'); }
      ctx.fillStyle = sky; ctx.fillRect(wx, wy, ww, wh);
      if (night) {
        const R = rng(7); ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for (let k = 0; k < 14; k++) ctx.fillRect(wx + R() * ww, wy + R() * wh * 0.7, 1.4, 1.4);
      } else if (sp === 'sunny') {
        ctx.fillStyle = 'rgba(255,236,170,0.95)';
        ctx.beginPath(); ctx.arc(wx + ww * 0.72, wy + wh * 0.24, Math.min(ww, wh) * 0.1, 0, Math.PI * 2); ctx.fill();
      }
      if (sp === 'bright') {
        ctx.fillStyle = night ? 'rgba(230,236,240,0.28)' : 'rgba(255,255,255,0.55)';
        ctx.fillRect(wx, wy, ww, wh);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
        for (let x = wx + 8; x < wx + ww; x += 10) {
          ctx.beginPath(); ctx.moveTo(x, wy);
          for (let y = wy; y <= wy + wh; y += 12) ctx.lineTo(x + Math.sin((y - wy) / 12) * 2, y);
          ctx.stroke();
        }
      }
      ctx.strokeStyle = '#F2F0E8'; ctx.lineWidth = 6; ctx.strokeRect(wx, wy, ww, wh);
      ctx.lineWidth = 4; ctx.beginPath();
      ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
      ctx.fillStyle = '#E4E1D7'; ctx.fillRect(wx - 8, wy + wh + 2, ww + 16, 7);
      if (!night) {
        const a = sp === 'sunny' ? 0.16 : 0.09;
        const gr = ctx.createLinearGradient(wx + ww, wy, wx + ww * 2.2, floorY);
        gr.addColorStop(0, `rgba(255,250,225,${a})`); gr.addColorStop(1, 'rgba(255,250,225,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.moveTo(wx + ww, wy + 10); ctx.lineTo(wx + ww, wy + wh); ctx.lineTo(wx + ww * 2.6, H); ctx.lineTo(wx + ww * 2.6, floorY * 0.7); ctx.closePath(); ctx.fill();
      }
    }
    if (s.humid) {
      const hx = W * 0.87, hy = H * 0.93, hw = Math.max(20, W * 0.06), hh = hw * 1.5;
      ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(hx, hy, hw * 0.7, hw * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F3F3EE'; ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); rrect(hx - hw / 2, hy - hh, hw, hh, hw * 0.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#7FB7D6'; ctx.fillRect(hx - hw * 0.18, hy - hh * 0.45, hw * 0.36, 3);
      const calm = reduceMQ.matches;
      for (let k = 0; k < 4; k++) {
        const f = calm ? k / 4 : ((t * 0.35 + k / 4) % 1);
        ctx.fillStyle = `rgba(235,242,246,${0.55 * (1 - f)})`;
        ctx.beginPath(); ctx.arc(hx + Math.sin(f * 6 + k) * 4, hy - hh - 6 - f * hh * 1.6, 3 + f * 9, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function rrect(x, y, w, h, r) {
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function drawPot(cx, groundY, S, idx, m) {
    const g = POT_GEOM[idx], w = g.w * S, h = g.h * S, top = groundY - h, rimH = h * 0.16, bw = w * 0.76;
    const pal = [['#3A403C', '#22272A', '#2E3431'], ['#C27A54', '#9B5737', '#B06A46'], ['#F1F0EA', '#C9C8C0', '#E4E3DB'], ['#4A504D', '#2A2F2D', '#3C4240']][idx];
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, groundY, w * 0.55, Math.max(3, h * 0.07), 0, 0, Math.PI * 2); ctx.fill();
    const gr = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    gr.addColorStop(0, pal[1]); gr.addColorStop(0.35, pal[0]); gr.addColorStop(1, pal[1]);

    ctx.moveTo(cx - (w / 2) * 0.96, top + rimH); ctx.lineTo(cx + (w / 2) * 0.96, top + rimH);

    }

      for (let k = 0; k < 40; k++) { const yy = top + rimH + R() * (h - rimH), sp = (w / 2) * (1 - ((yy - top) / h) * 0.24); ctx.fillRect(cx + (R() - 0.5) * 2 * sp * 0.92, yy, 1.2, 1.2); }
    }

  function draw(t, dt) {
    if (!state || !T.wall) return;
    const s = state, now = Date.now(), n = s.leaves.length, calm = reduceMQ.matches;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawRoom(now, t);

    const S0 = H / 600, cx = W * 0.56, groundY = H * 0.95;
    const tz = targetZoom(s, now, cx, groundY, S0);
    zoom = zoom ? zoom + (tz - zoom) * Math.min(1, dt * 2.5) : tz;
    const S = S0 * zoom;
    const potInfo = drawPot(cx, groundY, S, s.pot, s.m);
    const soilY = potInfo.soilY;

    if (s.pole) {
      const pw = 12 * S, ph = POLE_H * 0.9 * S, px = cx + 2 * S - pw / 2, py = soilY - ph;
      ctx.fillStyle = '#6E5B3C'; ctx.beginPath(); rrect(px, py, pw, ph, pw / 2); ctx.fill();
      const R = rng(5); ctx.strokeStyle = 'rgba(120,150,70,0.55)'; ctx.lineWidth = 1;
      for (let k = 0; k < 70; k++) {
        const yy = py + R() * ph, xx = px + R() * pw;

      }
    }

    const { items, stemH } = layout(s, now, t, S, cx, soilY, false);
    if (s.pole && n) {
      ctx.strokeStyle = T.leafDeep; ctx.lineWidth = Math.max(2, 5 * S); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, soilY);
      for (let k = 1; k <= n; k++) ctx.lineTo(cx + (k % 2 ? 3 : -3) * S, soilY - stemH * S * (k / n));

      ctx.strokeStyle = '#C9B98F'; ctx.lineWidth = Math.max(1, 1.4 * S);

      }

      ctx.strokeStyle = '#7B5A3C'; ctx.lineWidth = Math.max(1, 1.8 * S); ctx.lineCap = 'round';
      const roots = Math.min(3, Math.floor((n - 3) / 2));
      for (let k = 0; k < roots; k++) {

        const sx = cx + sd * 3 * S, sy = s.pole ? soilY - stemH * S * (0.25 + 0.22 * k) : soilY - 4 * S;

      }
    }
    for (const it of items) {
      ctx.strokeStyle = T.leafDeep; ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1.2, (2.2 + it.L.mat * 0.9) * S);
      ctx.beginPath(); ctx.moveTo(it.ax, it.ay); ctx.quadraticCurveTo(it.qx, it.qy, it.ex, it.ey); ctx.stroke();
    }
    leafHits = [];
    let plantTop = soilY;
    for (const it of items) {
      const lf = getLeaf(it.L, it.Lpx, it.p, now);
      ctx.save();
      ctx.translate(it.ex, it.ey);
      ctx.rotate(it.axis);
      ctx.drawImage(lf.c, -lf.ox / DPR, -lf.oy / DPR, lf.c.width / DPR, lf.c.height / DPR);
      ctx.restore();
      const mx = it.ex + Math.sin(it.axis) * it.Lpx * 0.5, my = it.ey - Math.cos(it.axis) * it.Lpx * 0.5;

        ctx.fillStyle = '#1E1E1A'; ctx.beginPath(); ctx.ellipse(x, y, 2.2, 1.5, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        if (!items.length) continue;
        const it = items[b.leaf % items.length], R = rng(b.seed);
        const mx = it.ex + Math.sin(it.axis) * it.Lpx * 0.5, my = it.ey - Math.cos(it.axis) * it.Lpx * 0.5;
        x = mx + (R() - 0.5) * it.Lpx * 0.3; y = my + (R() - 0.5) * it.Lpx * 0.3;
        ctx.fillStyle = '#B33A2A';
        for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + (R() - 0.5) * 9, y + (R() - 0.5) * 9, 1.4, 0, Math.PI * 2); ctx.fill(); }
      }

    drawParts(dt);
    if (s.spot === 'dim') {
      const vg = ctx.createRadialGradient(cx, H * 0.55, Math.min(W, H) * 0.2, cx, H * 0.55, Math.max(W, H) * 0.75);

  }

  function fx(kind) {
    if (reduceMQ.matches) return;

    if (kind === 'water') for (let k = 0; k < 22; k++) parts.push({ k: 'drop', x: cx + (R() - 0.5) * potW * 0.8, y: soilY - (90 + R() * 80) * S, vy: 220 + R() * 140, life: 1.2 });
    if (kind === 'mist') for (let k = 0; k < 26; k++) parts.push({ k: 'mist', x: cx + (R() - 0.5) * W * 0.55, y: top + (soilY - top) * R(), r: 2 + R() * 3, life: 1.4, max: 1.4 });
    if (kind === 'feed') for (let k = 0; k < 16; k++) parts.push({ k: 'spark', x: cx + (R() - 0.5) * potW * 0.7, y: soilY - R() * 10 * S, vy: -(30 + R() * 40), life: 1.2, max: 1.2, col: '157,209,90' });
    if (kind === 'clean' || kind === 'sparkle') {
      for (let k = 0; k < 18; k++) {
        const h = leafHits[Math.floor(R() * leafHits.length)];
        const x = h ? h.x + (R() - 0.5) * h.r : cx + (R() - 0.5) * 80, y = h ? h.y + (R() - 0.5) * h.r : soilY - 60;
        parts.push({ k: 'spark', x, y, vy: -(10 + R() * 20), life: 1, max: 1, col: kind === 'clean' ? '255,255,255' : '255,214,110' });
      }
    }
  }
  function drawParts(dt) {
    if (!parts.length) return;
    for (const p of parts) {
      p.life -= dt;
      if (p.k === 'drop') {
        p.y += p.vy * dt;
        if (p.y > geo.soilY) p.life = 0;
        ctx.fillStyle = 'rgba(110,175,230,0.85)';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 1.6, 3.6, 0, 0, Math.PI * 2); ctx.fill();
      } else if (p.k === 'mist') {
        const f = 1 - p.life / p.max;
        ctx.fillStyle = `rgba(225,238,245,${0.6 * (1 - f)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + f * 2), 0, Math.PI * 2); ctx.fill();
      } else {
        p.y += p.vy * dt;
        const a = clamp(p.life / p.max, 0, 1), r = 2.5 * a + 0.5;
        ctx.fillStyle = `rgba(${p.col},${a})`;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - r * 2); ctx.lineTo(p.x + r * 0.6, p.y); ctx.lineTo(p.x, p.y + r * 2); ctx.lineTo(p.x - r * 0.6, p.y); ctx.closePath(); ctx.fill();
      }
    }
    parts = parts.filter((p) => p.life > 0);
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (document.hidden) { lastTs = ts; return; }
    if (ts - lastDraw < 33) return;
    const dt = lastTs ? clamp((ts - lastTs) / 1000, 0, 0.1) : 0;
    lastTs = ts; lastDraw = ts;
    wig = Math.max(0, wig - dt * 1.2);
    draw(ts / 1000, dt);
  }
  function onCanvasTap(e) {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 30;
    for (const b of bugPos) { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = b; } }
    if (best) { catchBug(best.id); return; }
    for (const h of leafHits) {
      if (Math.hypot(h.x - x, h.y - y) < h.r) { wig = 1; toast(TIPS[tipIdx++ % TIPS.length]); return; }
    }
  }

  /* ---------- 시간 흐름 ---------- */
  function tick() {
    if (!state) return;
    const now = Date.now(), gap = now - state.lastTick, log = newLog();
    advance(state, now, log);
    if (gap > AWAY_MS) {
      if (state.welcomed && sheetName !== 'welcome') showAway(gap, log);
    } else if (log.leaves) {
      toast(`새 잎이 나왔어요! 코인 +${log.coins}`);
      fx('sparkle');
    } else if (log.bugs) {
      toast('해충이 생겼어요. 화면에서 눌러 잡아 주세요.', 'warn');
    }
    if (state.done && !state.doneShown && state.welcomed && !sheetName) {
      state.doneShown = true; markDirty(); openSheet('complete');
    }
    renderUI();
  }

  /* ---------- 시작 ---------- */
  function bindUI() {
    $('#aWater').addEventListener('click', doWater);
    $('#aMist').addEventListener('click', doMist);
    $('#aFeed').addEventListener('click', doFeed);
    $('#aClean').addEventListener('click', doClean);
    $('#aSpot').addEventListener('click', () => openSheet('spot'));
    $('#aShop').addEventListener('click', () => openSheet('shop'));
    $('#spotChip').addEventListener('click', () => openSheet('spot'));
    $('#btnInfo').addEventListener('click', () => openSheet('info'));
    $('#banners').addEventListener('click', (e) => { const b = e.target.closest('[data-action]'); if (b) runAction(b.dataset.action, b.dataset); });
    $('#sheetBody').addEventListener('click', (e) => { const b = e.target.closest('[data-action]'); if (b && !b.disabled) runAction(b.dataset.action, b.dataset); });
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#sheetBackdrop').addEventListener('click', closeSheet);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetName) closeSheet(); });
    cv.addEventListener('pointerdown', onCanvasTap);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (dirty) { saveLocal(); flushCloud(); } }
      else tick();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
    new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
    new ResizeObserver(resize).observe($('#scene'));
  }
  function boot(data) {
    let s = null, fromHot = false;
    if (data && data.state && typeof data.state === 'object') { s = data.state; fromHot = true; }
    if (!s) s = loadLocal();
    state = s ? migrate(s) : freshState();
    if (!localOk) saveMode = 'none';
    const gap = Date.now() - state.lastTick, log = newLog();
    advance(state, Date.now(), log);
    readTokens();
    bindUI();
    resize();
    renderUI();
    if (!state.welcomed) openSheet('welcome');
    else if (!fromHot && gap > AWAY_MS) showAway(gap, log);
    else if (state.done && !state.doneShown) { state.doneShown = true; openSheet('complete'); }
    requestAnimationFrame(frame);
    setInterval(tick, 1000);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readTokens(); renderUI(); });
    try {
      const hot = window.claude && window.claude.hot;
      if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ state: JSON.parse(JSON.stringify(state)) }));
    } catch (e) { /* 미리보기 밖에서는 없음 */ }
    connectCloud();
  }
  let booted = false;
  const start = (data) => { if (booted) return; booted = true; boot(data || {}); };
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.ready === 'function') { hot.ready(start); setTimeout(() => start({}), 1500); }
    else start((hot && hot.data) || {});
  } catch (e) {
    start({});
  }
})();
</script>

</body>
</html>
